<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workshop - EEF 10 Sep 2026</title>
    
    <!-- ฟอนต์ Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f2fbfa; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
        }
        
        .container {
            background-color: #ffffff;
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 166, 81, 0.1); 
            max-width: 650px; 
            width: 100%;
            border-top: 6px solid #00a651; 
        }
        
        h2 {
            color: #007c3d; 
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.15rem; /* ปรับขนาดฟอนต์ให้เล็กลงเพื่อให้พอดีกับบรรทัด */
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
        }

        .progress-container {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .progress-text {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            background-color: #e0f2e9;
            height: 8px; 
            border-radius: 4px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: #00a651;
            height: 100%;
            width: 20%; 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .step {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px; 
            color: #111;
            font-size: 1.1rem; 
        }
        
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 15px; 
            border: 1px solid #c8e6d3; 
            border-radius: 12px;
            font-family: 'Kanit', sans-serif;
            font-size: 1.05rem; 
            transition: all 0.3s ease;
            background-color: #fafdfb;
            margin-bottom: 20px; 
        }
        
        textarea {
            resize: vertical;
            min-height: 180px; 
            line-height: 1.6;
            margin-bottom: 0; 
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #00a651;
            box-shadow: 0 0 0 4px rgba(0, 166, 81, 0.15); 
            background-color: #ffffff;
        }
        
        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 14px 24px; 
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem; 
            font-family: 'Kanit', sans-serif;
            font-weight: 500;
            transition: all 0.2s ease;
            touch-action: manipulation;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .btn-next, .btn-submit {
            background-color: #00a651;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 166, 81, 0.2);
        }
        
        .btn-next:hover, .btn-submit:hover {
            background-color: #008a43;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 166, 81, 0.3);
        }

        .btn-prev {
            background-color: #ffffff;
            color: #555;
            border: 1px solid #ddd;
        }

        .btn-prev:hover {
            background-color: #f9f9f9;
            color: #111;
            border-color: #ccc;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            background-color: #a0d4b6;
            box-shadow: none;
            color: white;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            font-size: 1rem;
            min-height: 24px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h2 {
                font-size: 1.05rem; /* ปรับขนาดสำหรับมือถือให้เล็กลงด้วย */
            }
            textarea {
                min-height: 150px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบสอบถามเพื่อเก็บข้อมูลที่สะท้อนภาพรวมของการทำงานร่วมกันของพวกเรา <br>และข้อเสนอแนะที่จะทำให้วัฒนธรรมการทำงานของพวกเราเข้มแข็งขึ้น</h2>

    <div class="progress-container" id="progressContainer">
        <div class="progress-text" id="progressText">ส่วนที่ 1 / 5</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <form id="reflectionForm">
        
        <!-- ข้อ 1: ข้อมูลผู้ใช้ -->
        <div class="step active" id="step1">
            <label for="email">อีเมล (Email)</label>
            <input type="email" id="email" name="email" placeholder="ระบุอีเมลของคุณ..." required>

            <label for="name">ชื่อ-นามสกุล (Name)</label>
            <input type="text" id="name" name="name" placeholder="ระบุชื่อ-นามสกุล..." required>
        </div>

        <!-- ข้อ 2: Keep -->
        <div class="step" id="step2">
            <label for="keep">Keep: สิ่งที่ควรรักษา</label>
            <textarea id="keep" name="keep" placeholder="ระบุสิ่งที่ทำดีอยู่แล้ว และควรทำต่อไป..." required></textarea>
        </div>

        <!-- ข้อ 3: Strengthen -->
        <div class="step" id="step3">
            <label for="strengthen">Strengthen: สิ่งที่ควรทำให้แข็งแรงขึ้น</label>
            <textarea id="strengthen" name="strengthen" placeholder="ระบุสิ่งที่ทำอยู่แต่ต้องพัฒนาให้ดียิ่งขึ้น..." required></textarea>
        </div>

        <!-- ข้อ 4: Shift -->
        <div class="step" id="step4">
            <label for="shift">Shift: สิ่งที่ต้องเปลี่ยน</label>
            <textarea id="shift" name="shift" placeholder="ระบุสิ่งที่ควรปรับเปลี่ยนวิธีการทำงานใหม่..." required></textarea>
        </div>

        <!-- ข้อ 5: Stop -->
        <div class="step" id="step5">
            <label for="stop">Stop: สิ่งที่ควรยุติ</label>
            <textarea id="stop" name="stop" placeholder="ระบุสิ่งที่ควรเลิกทำ หรือส่งผลเสียต่องาน..." required></textarea>
        </div>

        <div class="button-group">
            <button type="button" class="btn-prev" id="prevBtn" style="display: none;" onclick="changeStep(-1)">ย้อนกลับ</button>
            <button type="button" class="btn-next" id="nextBtn" onclick="changeStep(1)">ถัดไป</button>
            <button type="submit" class="btn-submit" id="submitBtn" style="display: none;">ส่งข้อมูล</button>
        </div>

        <div id="statusMessage" class="message"></div>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyBwqrCtObDuUq8ZvWIO4uBq4XnwKJID4bf5p4DA1ZVfj-hEh2Dz8jT70ubIedOHRRq/exec';
    
    let currentStep = 1;
    const totalSteps = 5;

    function changeStep(n) {
        if (n === 1 && !validateCurrentStep()) {
            return; 
        }

        document.getElementById(`step${currentStep}`).classList.remove("active");
        currentStep = currentStep + n;
        document.getElementById(`step${currentStep}`).classList.add("active");
        
        updateUI();
    }

    function validateCurrentStep() {
        const currentInputs = document.querySelectorAll(`#step${currentStep} input, #step${currentStep} textarea`);
        for (let input of currentInputs) {
            if (!input.value.trim() || !input.checkValidity()) {
                input.reportValidity();
                return false;
            }
        }
        return true;
    }

    function updateUI() {
        document.getElementById('progressText').innerText = `ส่วนที่ ${currentStep} / ${totalSteps}`;
        const progressPercent = (currentStep / totalSteps) * 100;
        document.getElementById('progressBar').style.width = `${progressPercent}%`;

        if (currentStep === 1) {
            document.getElementById('prevBtn').style.display = "none";
        } else {
            document.getElementById('prevBtn').style.display = "flex";
        }

        if (currentStep === totalSteps) {
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('submitBtn').style.display = "flex";
        } else {
            document.getElementById('nextBtn').style.display = "flex";
            document.getElementById('submitBtn').style.display = "none";
        }
    }

    const form = document.forms['reflectionForm'];
    const submitBtn = document.getElementById('submitBtn');
    const prevBtn = document.getElementById('prevBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        prevBtn.disabled = true;
        submitBtn.textContent = 'กำลังบันทึก...';
        statusMessage.textContent = '';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                statusMessage.textContent = 'บันทึกข้อมูลเรียบร้อยแล้ว ขอบคุณครับ!';
                statusMessage.style.color = '#007c3d'; 
                form.reset(); 
                
                setTimeout(() => {
                    currentStep = 1;
                    document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
                    document.getElementById('step1').classList.add('active');
                    updateUI();
                    statusMessage.textContent = '';
                    
                    submitBtn.disabled = false;
                    prevBtn.disabled = false;
                    submitBtn.textContent = 'ส่งข้อมูล';
                }, 3000); 
            })
            .catch(error => {
                console.error('Error!', error.message);
                statusMessage.textContent = 'เกิดข้อผิดพลาด โปรดลองอีกครั้ง';
                statusMessage.style.color = '#d32f2f';
                submitBtn.disabled = false;
                prevBtn.disabled = false;
                submitBtn.textContent = 'ส่งข้อมูล';
            })
    });
</script>

</body>
</html>
